<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Rush 3D</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif;background:#0b1020;color:#fff;}
#gameWrap{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;}
canvas{display:block;}
#menu,#gameOver{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.6);padding:20px;border-radius:12px;text-align:center;}
button{padding:10px 20px;margin:5px;border:none;border-radius:8px;background:#00f5ff;color:#000;font-weight:bold;cursor:pointer;}
button.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3);}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="canvas"></canvas>

  <div id="menu">
    <h2>Geometry Rush</h2>
    <button id="startBtn">BAŞLA</button>
  </div>

  <div id="gameOver" style="display:none;">
    <h2>Game Over</h2>
    <p>Skor: <span id="finalScore">0</span></p>
    <button id="retryBtn">Yeniden Oyna</button>
    <button id="menuBtn" class="secondary">Menüye Dön</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w,h;
function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();

/* --- Oyun Durumu --- */
let running=false;
let player={x:0,y:0,w:40,h:40,vy:0,jump:-650,grounded:false,color:'#f7ff6b'};
let obstacles=[],score=0;
let gravity=1600,speed=300,spawnRate=1500,lastSpawn=0,lastTime=0;

/* --- Menü ve Game Over --- */
const menu = document.getElementById('menu');
const gameOver = document.getElementById('gameOver');
const startBtn = document.getElementById('startBtn');
const retryBtn = document.getElementById('retryBtn');
const menuBtn = document.getElementById('menuBtn');
const finalScore = document.getElementById('finalScore');

startBtn.onclick = ()=>{reset(); start();}
retryBtn.onclick = ()=>{reset(); start();}
menuBtn.onclick = ()=>{gameOver.style.display='none';menu.style.display='block';};

/* --- Oyun Başlat / Sıfırla --- */
function reset(){
  player.y = h*0.7;
  player.vy = 0;
  player.grounded = false;
  obstacles = [];
  score=0;
  lastSpawn=0;
}

function spawnObstacle(){
  const width = 40 + Math.random()*50;
  const height = 20 + Math.random()*120;
  obstacles.push({x:w+50,y:h-height-50,w:width,h:height,color:'#ff6b6b',passed:false});
}

function start(){
  menu.style.display='none';
  gameOver.style.display='none';
  running=true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

/* --- Çarpışma Kontrol --- */
function colliding(a,b){
  return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);
}

/* --- Zıplama --- */
function jump(){
  if(player.grounded){player.vy=player.jump;player.grounded=false;}
}
window.addEventListener('keydown',e=>{if(e.code==='Space')jump();});
window.addEventListener('mousedown',jump);
window.addEventListener('touchstart',jump);

/* --- Oyun Döngüsü --- */
function loop(ts){
  if(!running) return;
  const dt = (ts-lastTime)/1000;
  lastTime = ts;

  // player physics
  player.vy += gravity*dt;
  player.y += player.vy*dt;
  const ground = h*0.8 - player.h;
  if(player.y>ground){player.y=ground;player.vy=0;player.grounded=true;}

  // obstacle spawn
  lastSpawn += dt*1000;
  if(lastSpawn>spawnRate){lastSpawn=0;spawnObstacle();}

  // move obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    obstacles[i].x -= speed*dt;
    if(!obstacles[i].passed && obstacles[i].x+obstacles[i].w<player.x){obstacles[i].passed=true;score+=10;}
    if(obstacles[i].x+obstacles[i].w<0) obstacles.splice(i,1);
  }

  // collision
  for(let ob of obstacles) if(colliding(player,ob)){endGame();return;}

  draw();
  requestAnimationFrame(loop);
}

function endGame(){
  running=false;
  finalScore.textContent = score;
  gameOver.style.display='block';
}

/* --- Çizim (3D hissi için basit perspektif) --- */
function draw(){
  ctx.clearRect(0,0,w,h);

  // arka plan gradyan
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#1a052a'); grad.addColorStop(0.5,'#2b1055'); grad.addColorStop(1,'#412a8f');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

  // zemin
  ctx.fillStyle = '#222';
  ctx.fillRect(0,h*0.8,w,h*0.2);

  // obstacles
  for(let ob of obstacles){
    const depth = 1 - (ob.y/h)*0.2; // basit 3D hissi
    ctx.fillStyle = ob.color;
    ctx.fillRect(ob.x,ob.y,ob.w*depth,ob.h*depth);
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    ctx.strokeRect(ob.x,ob.y,ob.w*depth,ob.h*depth);
  }

  // player
  ctx.fillStyle=player.color;
  ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.strokeStyle='rgba(0,245,255,0.2)';
  ctx.strokeRect(player.x,player.y,player.w,player.h);

  // skor
  ctx.fillStyle='white';
  ctx.font='20px sans-serif';
  ctx.fillText('Skor: '+score,20,30);
}
</script>
</body>
</html>
